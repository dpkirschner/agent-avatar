<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Avatar">
<!-- theme-color follows the theme: app.js sets it from the page ground. -->
<meta name="theme-color" content="">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Avatar</title>
{{head}}
</head>
<body>
<div id="app" data-state="idle" data-preset="chat" class="empty">
  <header id="top" class="status">
    <div class="items"></div>
    <div class="own">
      <span id="agent-state"></span>
      <span id="link" title="Connection to the display server"></span>
      <time id="clock"></time>
    </div>
  </header>

  <main id="stage">
    <section id="side">
      <div id="avatar"></div>
      <div id="subs" aria-live="polite">
        <p id="heard"></p>
        <p id="said"></p>
        <p id="interim"></p>
      </div>
      <button id="mic" type="button">Talk</button>
    </section>
    <section id="content" aria-label="Content"></section>
  </main>

  <footer id="bottom" class="status" hidden>
    <div class="items"></div>
  </footer>

  <aside id="debug" aria-label="Debug log" hidden>
    <header>
      <h2>Debug log</h2>
      <button id="debug-copy" type="button">Copy</button>
      <button id="debug-clear" type="button">Clear</button>
      <button id="debug-close" type="button" aria-label="Close the debug log">Close</button>
    </header>
    <div id="debug-log"></div>
  </aside>

  <div id="corner" aria-hidden="true"></div>

  <div id="start" class="overlay">
    <button id="start-btn" type="button">Tap to start</button>
    <p class="hint">One tap lets the avatar speak and keeps the screen awake.</p>
    <p id="warn" class="warn" hidden></p>
  </div>

  <div id="settings" class="overlay" hidden>
    <div class="panel">
      <h2>Settings</h2>
      <label>Token <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="from the server's token file"></label>
      <label><input type="checkbox" id="continuous"> Listen continuously</label>
      <label><input type="checkbox" id="debug-on"> Debug log (timestamped trace on the right)</label>
      <label>Voice <select id="voice"><option value="">Default</option></select></label>
      <label>Rate <input id="rate" type="range" min="0.7" max="1.4" step="0.05" value="1"> <span id="rate-v">1.00</span></label>
      <div class="row">
        <button id="test-voice" type="button">Test voice</button>
        <button id="fullscreen" type="button">Full screen</button>
        <button id="reload" type="button">Reload</button>
      </div>
      <p class="hint">Hold the top-left corner to open this again. Browser voices are a fallback; a server with local speech sends audio instead.</p>
      <button id="close-settings" type="button" class="primary">Done</button>
    </div>
  </div>
</div>
</body>
</html>
