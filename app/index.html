<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Avatar">
<meta name="theme-color" content="#14161b">
<title>Avatar</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<template id="sprite-tpl">
  <svg class="sprite" viewBox="0 0 240 240" aria-hidden="true">
    <circle class="ring" cx="120" cy="120" r="92"/>
    <g class="bob">
      <circle class="body" cx="120" cy="120" r="88"/>
      <g class="eyes">
        <ellipse class="eye" cx="88" cy="105" rx="18" ry="22"/>
        <circle class="pupil" cx="90" cy="108" r="8"/>
        <ellipse class="eye" cx="152" cy="105" rx="18" ry="22"/>
        <circle class="pupil" cx="154" cy="108" r="8"/>
      </g>
      <ellipse class="mouth" cx="120" cy="160" rx="22" ry="14"/>
      <g class="dots">
        <circle cx="170" cy="48" r="7"/>
        <circle cx="190" cy="34" r="8"/>
        <circle cx="212" cy="22" r="9"/>
      </g>
    </g>
  </svg>
</template>

<div id="app" data-state="idle">
  <main id="stage">
    <iframe id="screen" title="Screen" hidden></iframe>
    <div id="avatar"></div>
  </main>

  <footer id="bar">
    <button id="mic" type="button">Talk</button>
    <div id="caption" aria-live="polite">
      <div id="interim"></div>
      <div id="heard"></div>
      <div id="said"></div>
    </div>
    <span id="link" title="Connection to the display server"></span>
  </footer>

  <div id="corner" aria-hidden="true"></div>

  <div id="start" class="overlay">
    <button id="start-btn" type="button">Tap to start</button>
    <p class="hint">One tap lets the avatar speak and keeps the screen awake.</p>
    <p id="warn" class="warn" hidden></p>
  </div>

  <div id="settings" class="overlay" hidden>
    <div class="panel">
      <h2>Settings</h2>
      <label><input type="checkbox" id="continuous"> Listen continuously</label>
      <label>Voice <select id="voice"><option value="">Default</option></select></label>
      <label>Rate <input id="rate" type="range" min="0.7" max="1.4" step="0.05" value="1"> <span id="rate-v">1.00</span></label>
      <div class="row">
        <button id="test-voice" type="button">Test voice</button>
        <button id="fullscreen" type="button">Full screen</button>
        <button id="reload" type="button">Reload</button>
      </div>
      <p class="hint">Hold the top-left corner to open this again. Browser voices are a fallback; a server with local speech sends audio instead.</p>
      <button id="close-settings" type="button" class="primary">Done</button>
    </div>
  </div>
</div>
</body>
</html>
