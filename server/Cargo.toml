[package]
name = "agent-avatar-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Display server for agent-avatar: show / sprite / say over HTTP, pushed to a kiosk page by SSE"

[[bin]]
name = "agent-avatar-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
