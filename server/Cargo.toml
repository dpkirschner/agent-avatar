[package]
name = "agent-avatar-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Display server for agent-avatar: show / sprite / say over HTTP, pushed to a kiosk page by SSE"

[[bin]]
name = "agent-avatar-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
